# Set prefix key to Ctrl-a (instead of default Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start window/pane numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable true colors (for terminal themes)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar customization
set -g status-interval 1
set -g status-left-length 50
set -g status-right "#(whoami)@#h"

# Black and white color scheme
set -g status-style bg=default,fg=white  # Status bar text (white)
set -g window-status-current-style fg=brightwhite,bold  # Current window highlight
set -g pane-border-style fg=gray  # Inactive pane borders
set -g pane-active-border-style fg=white  # Active pane border
